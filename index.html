<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jintao Xu (徐金涛) at Beijing Institute of Technology. Research interests: embodied intelligence and industrial robotics.">
  <title>Jintao Xu · Beijing Institute of Technology</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #142b40;
      --muted: #4e6477;
      --accent: #165b9a;
      --line: #d9e4ec;
      --paper: #fcfdfe;
      --mono: ui-monospace, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 1rem/1.6 system-ui, "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .page {
      width: min(70rem, calc(100% - 3rem));
      margin-inline: auto;
    }

    .masthead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      min-height: 4.4rem;
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      font-weight: 700;
    }

    .wordmark::before {
      content: "";
      width: .65rem;
      height: .65rem;
      border: 2px solid var(--accent);
      border-radius: 50%;
    }

    a { color: var(--accent); text-underline-offset: .22em; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }

    .hero {
      display: grid;
      grid-template-columns: 1.14fr 1fr;
      align-items: center;
      gap: clamp(2rem, 6vw, 6rem);
      padding-block: clamp(2.5rem, 6vw, 4rem);
    }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      font: 600 .78rem/1.5 var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: .55rem 0 .2rem;
      font-size: clamp(3rem, 7.5vw, 6.2rem);
      line-height: 1.04;
      letter-spacing: -.062em;
    }

    .chinese-name {
      margin: .4rem 0 1.35rem;
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 650;
      letter-spacing: .1em;
    }

    .affiliation { margin: 0 0 1.4rem; font-weight: 600; }
    .affiliation span { display: block; color: var(--muted); font-weight: 400; }

    .email {
      display: inline-flex;
      align-items: center;
      gap: .58rem;
      max-width: 100%;
      min-height: 2.75rem;
      padding: .45rem .75rem;
      border: 1px solid var(--line);
      border-radius: .4rem;
      background: white;
      font: 500 clamp(.78rem, 2.7vw, .94rem)/1.35 var(--mono);
      overflow-wrap: anywhere;
    }

    .email svg { flex: none; }
    .diagram {
      display: block;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: .65rem;
      background: #edf5fb;
    }

    .research {
      padding-block: 1.5rem 2rem;
      border-top: 1px solid var(--line);
    }

    .section-title {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: .35rem .85rem;
      margin: 0 0 1.15rem;
      font-size: clamp(1.45rem, 3vw, 1.85rem);
      line-height: 1.3;
      letter-spacing: -.025em;
    }

    .section-title span { color: var(--muted); font-size: .9rem; font-weight: 500; }
    .topics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .85rem 1.25rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .topic {
      display: flex;
      align-items: flex-start;
      gap: .85rem;
      padding: 1rem 1.15rem;
      border: 1px solid var(--line);
      border-radius: .45rem;
      background: white;
    }

    .topic-index { padding-top: .2rem; color: var(--accent); font: .8rem/1.5 var(--mono); }
    .topic h3 { margin: 0; font-size: 1.1rem; line-height: 1.4; }
    .topic p { margin: .25rem 0 0; color: var(--muted); font-size: .9rem; }

    @media (max-width: 700px) {
      .page { width: calc(100% - 2.25rem); }
      .hero { grid-template-columns: 1fr; }
      .diagram { max-width: 29rem; }
    }

    @media (max-width: 480px) {
      .topics { grid-template-columns: 1fr; }
      .masthead { min-height: 3.75rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <span class="wordmark">Jintao Xu</span>
      <nav aria-label="Page navigation"><a href="#research">Research</a></nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="name">
        <div>
          <p class="eyebrow">Academic homepage</p>
          <h1 id="name">Jintao Xu</h1>
          <p class="chinese-name" lang="zh-CN">徐金涛</p>
          <p class="affiliation">Beijing Institute of Technology<span lang="zh-CN">北京理工大学</span></p>
          <a class="email" href="mailto:1120221023@bit.edu.cn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="m4 7 8 6 8-6"/>
            </svg>
            1120221023@bit.edu.cn
          </a>
        </div>

        <svg class="diagram" viewBox="0 0 480 340" role="img" aria-labelledby="diagram-title" xmlns="http://www.w3.org/2000/svg">
          <title id="diagram-title">Line drawing of an industrial robot arm with a two-finger gripper</title>
          <defs>
            <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
              <path d="M 24 0 H 0 V 24" fill="none" stroke="#d7e6f1"/>

            <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
              <path d="M0 0 8 4 0 8Z" fill="#517a9c"/>
            </marker>
          </defs>
          <rect width="480" height="340" fill="url(#grid)"/>
          <path d="M36 278H444" fill="none" stroke="#9bb9cf" stroke-dasharray="4 5"/>
          <path d="M58 261V220M58 261H99" fill="none" stroke="#517a9c" stroke-width="1.5" marker-end="url(#arrow)"/>
          <g fill="#416681" font-family="ui-monospace, Consolas, monospace" font-size="12">
            <text x="51" y="212">z</text>
            <text x="106" y="265">x</text>
            <text x="26" y="34" letter-spacing="1.6">ROBOTIC MANIPULATOR</text>
          </g>
          <path d="M149 277v-14h112v14zm23-14v-32h65v32z" fill="#a8c9e1" stroke="#194b75" stroke-width="2.5" stroke-linejoin="round"/>
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="m204 224 54-115 85 38" stroke="#194b75" stroke-width="38"/>
            <path d="m204 224 54-115 85 38" stroke="#c3ddf0" stroke-width="32"/>
            <path d="m204 224 54-115 85 38" stroke="#769dbb" stroke-width="1.5" stroke-dasharray="4 6"/>
            <path d="M343 147v35m-16 0h32m-32 0v15l6 6m26-21v15l-6 6" stroke="#194b75" stroke-width="3"/>
          </g>
          <g fill="#e7f3fb" stroke="#194b75" stroke-width="2.5">
            <circle cx="204" cy="224" r="21"/>
            <circle cx="258" cy="109" r="20"/>
            <circle cx="343" cy="147" r="15"/>
          </g>
          <g fill="#2e6fa5">
            <circle cx="204" cy="224" r="6"/>
            <circle cx="258" cy="109" r="6"/>
            <circle cx="343" cy="147" r="4.5"/>
          </g>
        </svg>
      </section>

      <section class="research" id="research" aria-labelledby="research-title">
        <h2 class="section-title" id="research-title">Research interests <span lang="zh-CN">研究方向</span></h2>
        <ul class="topics">
          <li class="topic">
            <span class="topic-index" aria-hidden="true">01</span>
            <div><h3>Embodied Intelligence</h3><p lang="zh-CN">具身智能</p></div>
          </li>
          <li class="topic">
            <span class="topic-index" aria-hidden="true">02</span>
            <div><h3>Industrial Robotics</h3><p lang="zh-CN">工业机器人</p></div>
          </li>
        </ul>
      </section>
    </main>
  </div>
</body>
</html>
